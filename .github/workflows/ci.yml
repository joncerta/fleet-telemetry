name: CI

# CI del backend. Los nombres de los jobs (`verify`, `integration`) son los checks obligatorios
# en la protección de ramas de `develop` y `master`: no los renombres sin actualizarla.
# El job `infra` valida lo que cambia en `infra/` y `docker-compose.yml` (pruebas de k6, perfil `app` de compose con un
# humo de k6 y su verificación de conteos, y Terraform por Docker). Para que bloquee el merge hay que agregarlo
# como check obligatorio en la protección de ramas (lo hace el humano).
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Solo se cancelan corridas de PR; las de push a develop/master siempre terminan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typecheck, lint y tests unitarios. No necesita el stack (Postgres ni Redpanda).
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versión de pnpm desde `packageManager` de package.json (esta action soporta pnpm v12).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-verify-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-verify-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # Integración y e2e contra el stack real, levantado con el mismo docker-compose.yml que en local.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Credenciales efímeras del runner (placeholders de .env.example), no son secretos.
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ci-ephemeral-postgres
      FLEET_APP_PASSWORD: ci-ephemeral-app
      FLEET_RO_PASSWORD: ci-ephemeral-ro
      DATABASE_ADMIN_URL: postgres://fleet:ci-ephemeral-postgres@127.0.0.1:5432/fleet
      DATABASE_URL: postgres://fleet_app:ci-ephemeral-app@127.0.0.1:5432/fleet
      DATABASE_RO_URL: postgres://fleet_ro:ci-ephemeral-ro@127.0.0.1:5432/fleet
      KAFKA_BROKERS: 127.0.0.1:19092
      LOG_LEVEL: info
      # Contraseña de los usuarios de demo que siembra db:seed (los e2e de fleet-api hacen login con ellos).
      SEED_USER_PASSWORD: ci-ephemeral-user
      # compose interpola también los servicios del perfil `app` (aunque aquí solo se levanta la infraestructura) y fleet-api lo exige.
      # Los e2e usan el suyo propio (tests/e2e/harness.ts). >= 32 bytes.
      SESSION_SECRET: ci-ephemeral-session-secret-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-integration-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mismo compose que en local: mismas imágenes y mismo init de tópicos. El runner es efímero,
      # así que no hay limpieza (y `down -v` está prohibido por las reglas del proyecto).
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Build
        run: pnpm build

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      # El e2e de la web (Playwright) corre en headless: basta el headless shell de Chromium, con sus dependencias del sistema.
      # La versión del navegador sale del @playwright/test del lockfile.
      - name: Install Playwright browser
        run: pnpm --filter @fleet/web exec playwright install --with-deps --only-shell chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Collect compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1

      # Las trazas de Playwright (trace: retain-on-failure) van con los logs de compose.
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs
          path: |
            compose-logs.txt
            apps/web/test-results
          retention-days: 7
          if-no-files-found: warn

  # Infraestructura: pruebas de k6, perfil `app` de compose con un humo de k6 y su verificación de conteos, y Terraform por Docker
  # (sin instalar nada en el runner; las mismas imágenes que se usan en local). Nada se despliega: Terraform solo fmt, validate,
  # tflint y trivy.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Credenciales efímeras del runner (placeholders de .env.example), no son secretos.
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ci-ephemeral-postgres
      FLEET_APP_PASSWORD: ci-ephemeral-app
      FLEET_RO_PASSWORD: ci-ephemeral-ro
      DATABASE_URL: postgres://fleet_app:ci-ephemeral-app@127.0.0.1:5432/fleet
      DATABASE_RO_URL: postgres://fleet_ro:ci-ephemeral-ro@127.0.0.1:5432/fleet
      KAFKA_BROKERS: 127.0.0.1:19092
      LOG_LEVEL: info
      # >= 32 bytes (fleet-api no arranca con menos).
      SESSION_SECRET: ci-ephemeral-session-secret-0123456789abcdef
      # El agente del perfil `app` arranca con el modelo con guion: CI no tiene (ni necesita) una API key de Anthropic.
      AGENT_MODEL_PROVIDER: scripted
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-infra-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-infra-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Los scripts de k6 usan @fleet/platform y @fleet/contracts ya compilados.
      - name: Build
        run: pnpm build

      # Node 24 trata un directorio como archivo: se pasa un glob.
      - name: k6 model and checks tests
        run: node --test "infra/k6/lib/*.test.mjs"

      # --- Terraform por Docker. Primero tflint y trivy (antes de `init`, que deja .terraform con los proveedores) ---
      - name: Terraform fmt
        run: docker run --rm -v "$PWD:/work" -w /work/infra/terraform hashicorp/terraform:1.16.5 fmt -check -recursive

      - name: tflint
        run: >
          docker run --rm -v "$PWD:/work" -w /work/infra/terraform ghcr.io/terraform-linters/tflint:v0.64.0
          --recursive --config /work/infra/terraform/.tflint.hcl

      - name: trivy config
        run: >
          docker run --rm -v "$PWD/infra/terraform:/src:ro" aquasec/trivy:0.75.0
          config --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 /src

      # Sin backend (no hay estado ni credenciales) y con el archivo de bloqueo en solo lectura: si cambia un proveedor sin actualizar
      # .terraform.lock.hcl, falla.
      - name: Terraform init and validate
        run: |
          for root in bootstrap envs/dev envs/dev-topics; do
            echo "::group::terraform $root"
            docker run --rm -v "$PWD:/work" -w "/work/infra/terraform/$root" hashicorp/terraform:1.16.5 init -backend=false -input=false -lockfile=readonly
            docker run --rm -v "$PWD:/work" -w "/work/infra/terraform/$root" hashicorp/terraform:1.16.5 validate
            echo "::endgroup::"
          done

      # --- Perfil `app` de compose + humo de k6 con su verificación de conteos ---
      # Runner efímero: no hay backlog en Redpanda, así que no hace falta anclar el grupo (anchor-group.mjs).
      - name: Start infrastructure
        run: docker compose up -d --wait --wait-timeout 240

      # Todas las imágenes (incluida la web) parten del mismo stage `deps` del Dockerfile: el `pnpm install` se hace una vez y su capa
      # se comparte. Tras construir se libera la caché de build (ya no hace falta) para dejar disco al resto del job.
      - name: Build app images
        run: |
          docker compose --profile app build
          docker builder prune --all --force
          df -h /

      # Falla si migrate falla (set -eu) o si un servicio con healthcheck no llega a healthy.
      - name: Start app profile
        run: docker compose --profile app up -d --wait --wait-timeout 240

      - name: Check gateway, fleet-api, agent and web health
        run: |
          for service in ingest-gateway fleet-api agent web; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "fleet-telemetry-$service-1")"
            echo "$service: $status"
            [ "$status" = "healthy" ] || exit 1
          done

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0

      - name: Load tenant and tokens
        run: node infra/k6/scripts/setup.mjs

      # Humo de 30 s + verificación de conteos tras lag cero (sale con código distinto de cero si algo no cuadra).
      - name: k6 smoke and verification
        run: node infra/k6/scripts/run.mjs --run-id ci-smoke

      # Los tokens de carga (tokens.json) no se suben: solo los resúmenes de la corrida.
      - name: Collect compose logs
        if: failure()
        run: docker compose --profile app logs --no-color --timestamps > compose-logs.txt 2>&1

      - name: Upload k6 results and compose logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-diagnostics
          path: |
            compose-logs.txt
            infra/k6/.run/*.run.json
            infra/k6/.run/*.k6.json
            infra/k6/.run/*.verify.json
            infra/k6/.run/*.chaos.json
          retention-days: 7
          if-no-files-found: warn
