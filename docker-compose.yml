# Sin perfil: solo infraestructura (timescaledb, redpanda, redpanda-init).
# Perfil `app`: además migrate (un solo uso), ingest-gateway, processor y fleet-api. agent y web se agregan cuando existan.
# Nunca `docker compose down -v`: borra el volumen de datos.
name: fleet-telemetry

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17.11-ts2.30.2
    # El Cmd por defecto de la imagen es ["postgres"] (Entrypoint /docker-entrypoint.sh): se conserva
    # y se añade la marca de servidor que exige `db:rollback`. Solo existe en local; Terraform y AWS nunca la definen.
    command: ["postgres", "-c", "fleet.environment=local"]
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: "${POSTGRES_USER:?Falta POSTGRES_USER, copia .env.example a .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD, copia .env.example a .env}"
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Sin scripts de init: extensiones y roles los crean las migraciones (pnpm db:migrate).
      - timescaledb-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    mem_limit: 1g
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Crea los tópicos de forma idempotente y queda inactivo (healthy) cuando terminó.
  # Mantener alineado con la tabla de infra/CLAUDE.md.
  redpanda-init:
    image: redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        B=redpanda:9092
        DAY=86400000
        # Propiedad de cluster (dev-container la activa por defecto); idempotente.
        rpk -X admin.hosts=redpanda:9644 cluster config set auto_create_topics_enabled false
        create() {
          # nombre particiones retención_ms
          if rpk -X brokers=$$B topic describe "$$1" >/dev/null 2>&1; then
            echo "existe: $$1"
          else
            rpk -X brokers=$$B topic create "$$1" -p "$$2" -r 1 -c retention.ms="$$3"
          fi
        }
        create telemetry.raw 3 $$((3 * DAY))
        create telemetry.dlq 1 $$((14 * DAY))
        create vehicle.state 3 $$((1 * DAY))
        create fleet.alerts 3 $$((3 * DAY))
        rpk -X brokers=$$B topic list
        # `up --wait` (compose v5.3) falla si un contenedor sale durante la espera,
        # aun con código 0, y `up` reinicia el init cada vez. Se queda inactivo y healthy.
        touch /tmp/topics-ready
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/topics-ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # --- Perfil `app` ---------------------------------------------------------------------------------------------
  # Los hosts internos son los de la red de compose (timescaledb:5432, redpanda:9092); los valores de .env apuntan a
  # 127.0.0.1 (para `pnpm dev` en el host) y aquí se sobrescriben. Las variables opcionales sin valor (`- NOMBRE`) se
  # toman de .env o del entorno; si no están definidas, el servicio usa su valor por defecto (ver .env.example).

  # Aplica las migraciones con el superusuario y queda inactivo y healthy (mismo patrón que redpanda-init: `up --wait`
  # falla en compose v5.3 si un contenedor sale durante la espera). `set -eu` hace que el script termine con el código de
  # error del comando de migración y NO llegue a `touch`: el healthcheck nunca pasa, el contenedor sale y `up --wait` falla.
  # Sin `set -eu`, `sh -c` seguía tras el fallo, creaba /tmp/migrated y `up --wait` terminaba en éxito con el esquema sin migrar.
  migrate:
    profiles: ["app"]
    image: fleet-telemetry/migrate:local
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      target: migrate
      args:
        SERVICE: platform
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_ADMIN_URL: "postgres://${POSTGRES_USER:?Falta POSTGRES_USER}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@timescaledb:5432/fleet"
      FLEET_APP_PASSWORD: "${FLEET_APP_PASSWORD:?Falta FLEET_APP_PASSWORD, copia .env.example a .env}"
      FLEET_RO_PASSWORD: "${FLEET_RO_PASSWORD:?Falta FLEET_RO_PASSWORD, copia .env.example a .env}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_MIGRATE_LOCK_TIMEOUT_MS: "${DB_MIGRATE_LOCK_TIMEOUT_MS:-8000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rm -f /tmp/migrated
        node packages/platform/dist/cli/migrate.js
        touch /tmp/migrated
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migrated"]
      interval: 2s
      timeout: 2s
      retries: 60

  ingest-gateway:
    profiles: ["app"]
    image: fleet-telemetry/ingest-gateway:local
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      target: service
      args:
        SERVICE: ingest-gateway
    depends_on:
      redpanda-init:
        condition: service_healthy
      migrate:
        condition: service_healthy
    restart: unless-stopped
    # Mayor que SHUTDOWN_TIMEOUT_MS (15 s por defecto): si no, Docker mata el proceso antes del apagado ordenado.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      INGEST_GATEWAY_HOST: "0.0.0.0"
      INGEST_GATEWAY_PORT: "4001"
      DATABASE_URL: "postgres://fleet_app:${FLEET_APP_PASSWORD:?Falta FLEET_APP_PASSWORD, copia .env.example a .env}@timescaledb:5432/fleet"
      KAFKA_BROKERS: "redpanda:9092"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS:-15000}"
      INGEST_GATEWAY_BODY_LIMIT_BYTES:
      INGEST_GATEWAY_TRUSTED_PROXY_HOPS:
      INGEST_GATEWAY_RATE_LIMIT_MAX:
      INGEST_GATEWAY_RATE_LIMIT_WINDOW_MS:
      INGEST_GATEWAY_AUTH_FAILURE_LIMIT_MAX:
      INGEST_GATEWAY_AUTH_FAILURE_LIMIT_WINDOW_MS:
      INGEST_GATEWAY_DEVICE_RATE_LIMIT_MAX:
      INGEST_GATEWAY_DEVICE_RATE_LIMIT_WINDOW_MS:
      INGEST_GATEWAY_TOKEN_CACHE_TTL_MS:
      INGEST_GATEWAY_TOKEN_CACHE_NEGATIVE_TTL_MS:
      INGEST_GATEWAY_TOKEN_CACHE_MAX_ENTRIES:
      INGEST_GATEWAY_MAX_IN_FLIGHT_AUTH_LOOKUPS:
      INGEST_GATEWAY_FUTURE_TOLERANCE_MS:
      INGEST_GATEWAY_MAX_AGE_MS:
      INGEST_GATEWAY_MAX_POINT_BYTES:
      INGEST_GATEWAY_PUBLISH_TIMEOUT_MS:
      INGEST_GATEWAY_KAFKA_RETRIES:
      INGEST_GATEWAY_MAX_IN_FLIGHT_PUBLICATIONS:
    healthcheck:
      # La imagen no trae curl: `fetch` de Node. /health responde 503 si falta la base o Kafka.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Sin healthcheck: el processor no expone HTTP todavía (pendiente para backend-engineer: /health o heartbeat de
  # archivo). `up --wait` espera a que esté `running`; si el consumer cae sin reinicio el proceso sale (ADR-005.12) y
  # `restart: unless-stopped` lo levanta.
  processor:
    profiles: ["app"]
    image: fleet-telemetry/processor:local
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      target: service
      args:
        SERVICE: processor
    depends_on:
      redpanda-init:
        condition: service_healthy
      migrate:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: "postgres://fleet_app:${FLEET_APP_PASSWORD:?Falta FLEET_APP_PASSWORD, copia .env.example a .env}@timescaledb:5432/fleet"
      KAFKA_BROKERS: "redpanda:9092"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS:-15000}"
      PROCESSOR_CONSUMER_GROUP:
      PROCESSOR_MAX_ATTEMPTS:
      PROCESSOR_RETRY_INITIAL_DELAY_MS:
      PROCESSOR_RETRY_MAX_DELAY_MS:
      PROCESSOR_INSERT_CHUNK_SIZE:
      PROCESSOR_DLQ_PUBLISH_TIMEOUT_MS:
      PROCESSOR_EVENTS_PUBLISH_TIMEOUT_MS:
      ALERT_CRITICAL_STOP_MINUTES:
      STOP_SPEED_THRESHOLD_MPS:
      STOP_DISPLACEMENT_THRESHOLD_M:

  # REST + SSE. Lee la base (fleet_app) y consume vehicle.state y fleet.alerts. Cada réplica que alimenta SSE recibe todos los
  # eventos: no comparte consumer group (lo gestiona el servicio). /health consulta la base (sirve para compose y e2e); en AWS el
  # ALB y ECS usan /health/live, sin dependencias (ver infra/CLAUDE.md). SESSION_SECRET sale de .env (>= 32 bytes).
  fleet-api:
    profiles: ["app"]
    image: fleet-telemetry/fleet-api:local
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      target: service
      args:
        SERVICE: fleet-api
    depends_on:
      redpanda-init:
        condition: service_healthy
      migrate:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      FLEET_API_HOST: "0.0.0.0"
      FLEET_API_PORT: "4002"
      DATABASE_URL: "postgres://fleet_app:${FLEET_APP_PASSWORD:?Falta FLEET_APP_PASSWORD, copia .env.example a .env}@timescaledb:5432/fleet"
      KAFKA_BROKERS: "redpanda:9092"
      SESSION_SECRET: "${SESSION_SECRET:?Falta SESSION_SECRET (>= 32 bytes), copia .env.example a .env}"
      FLEET_API_CORS_ORIGINS: "${FLEET_API_CORS_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS:-15000}"
      SESSION_TTL_HOURS:
      FLEET_API_COOKIE_SECURE:
      SSE_HEARTBEAT_MS:
      FLEET_API_TRUSTED_PROXY_HOPS:
      FLEET_API_RATE_LIMIT_MAX:
      FLEET_API_RATE_LIMIT_WINDOW_MS:
      FLEET_API_LOGIN_FAILURE_LIMIT_MAX:
      FLEET_API_LOGIN_FAILURE_LIMIT_WINDOW_MS:
      FLEET_API_PAIR_FAILURE_LIMIT_MAX:
      FLEET_API_PAIR_FAILURE_LIMIT_WINDOW_MS:
      FLEET_API_PAIRING_CODE_TTL_MINUTES:
    healthcheck:
      # La imagen no trae curl: `fetch` de Node. /health responde 503 si falta la base.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4002/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  timescaledb-data:
  redpanda-data:
