# Sin red los puntos se acumulan como pendientes; al volver la conexión la cola baja a cero por lotes.
# Requiere el gateway local arriba (pnpm dev) y -e TOKEN=... -e VEHICLE_ID=...
# Uso: maestro test -e TOKEN=fdt_... -e VEHICLE_ID=<uuid> apps/mobile/.maestro/04-pendientes-y-reconexion.yaml
appId: co.fleet.driver
env:
  DEV_CLIENT_URL: "fleetdriver://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow: subflows/open-dev-client.yaml
- runFlow: subflows/pair.yaml
- tapOn:
    id: "start-shift"
- extendedWaitUntil:
    visible:
      id: "stop-shift"
    timeout: 15000

# Con red: los primeros puntos se envían.
- setLocation:
    latitude: 4.7110
    longitude: -74.0721
- waitForAnimationToEnd:
    timeout: 6000
- setLocation:
    latitude: 4.7120
    longitude: -74.0721
- tapOn:
    id: "tab-diagnostics"
- extendedWaitUntil:
    visible:
      id: "diag-sent"
      text: "[1-9][0-9]*"
    timeout: 60000

# Sin red: modo avión. Nada se pierde; el contador de pendientes sube.
- setAirplaneMode: enabled
- repeat:
    times: 4
    commands:
      - setLocation:
          latitude: 4.7130
          longitude: -74.0721
      - waitForAnimationToEnd:
          timeout: 6000
      - setLocation:
          latitude: 4.7140
          longitude: -74.0721
      - waitForAnimationToEnd:
          timeout: 6000
- extendedWaitUntil:
    visible:
      id: "diag-pending"
      text: "[1-9][0-9]*"
    timeout: 30000
- assertVisible:
    id: "pending-badge"
    text: "Pendientes: [1-9][0-9]*"
- assertVisible:
    id: "connection-state"
    text: "Sin conexión"

# Recuperar la conexión: pendientes en cero.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: "pending-badge"
      text: "Pendientes: 0"
    timeout: 120000
- assertVisible:
    id: "diag-pending"
    text: "0"
- assertVisible:
    id: "diag-rejected"
    text: "0"
