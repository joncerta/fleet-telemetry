# Vincula el dispositivo pegando el token. Requiere -e TOKEN=fdt_... -e VEHICLE_ID=<uuid>
# (los imprime `pnpm device:token -- --vehicle NRT101`; el vehicleId sale en el log a stderr).
appId: co.fleet.driver
---
- assertVisible:
    id: "pairing-screen"
- tapOn:
    id: "token-input"
- inputText: ${TOKEN}
- tapOn:
    id: "vehicle-input"
- inputText: ${VEHICLE_ID}
- tapOn:
    id: "link-button"
- extendedWaitUntil:
    visible:
      id: "shift-screen"
    timeout: 10000
