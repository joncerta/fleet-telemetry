# Configurar el token: un token mal formado se rechaza con mensaje; uno bueno vincula y lleva a la pantalla de turno.
# Uso: maestro test -e TOKEN=fdt_... -e VEHICLE_ID=<uuid> apps/mobile/.maestro/01-configurar-token.yaml
appId: co.fleet.driver
env:
  DEV_CLIENT_URL: "fleetdriver://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- runFlow: subflows/open-dev-client.yaml
- assertVisible:
    id: "pairing-screen"
# Token inválido: no vincula y explica el formato.
- tapOn:
    id: "token-input"
- inputText: "no-es-un-token"
- tapOn:
    id: "link-button"
- assertVisible:
    id: "pairing-error"
- assertNotVisible:
    id: "shift-screen"
# Token válido.
- tapOn:
    id: "token-input"
- eraseText: 40
- inputText: ${TOKEN}
- tapOn:
    id: "vehicle-input"
- inputText: ${VEHICLE_ID}
- tapOn:
    id: "link-button"
- extendedWaitUntil:
    visible:
      id: "shift-screen"
    timeout: 10000
- assertVisible:
    id: "start-shift"
# El token sobrevive a reiniciar la app (expo-secure-store).
- stopApp
- launchApp
- assertVisible:
    id: "shift-screen"
